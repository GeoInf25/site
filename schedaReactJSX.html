<html>

<head>
    <meta charset="UTF-8">
    <title>JSX directly in HTML</title>

    <!-- 1. Carichiamo React e React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- 2. Carichiamo Babel per far capire il JSX al browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/8.0.4/babel.min.js"></script>

</head>

<body style="font-family: 'Trebuchet MS'; ">

    <p><b>📚 JSX (JavaScript XML) and Babel directly in HTML</b>:</p>
    <p>- Temperature scales -</p>
    <div id="divRangeC"></div>
    <br>
    <div id="divRangeF"></div>

    <script type="text/babel">
        // 1. Canale globale
        const TempContext = React.createContext();

        // 4. L'App fa da "Provider" dello stato e teletrasporta i componenti nei rispettivi div
        function App() {
            const [c, setC] = React.useState("50.00");
            const [f, setF] = React.useState("122.00");

            return (
                <>
                    <TempContext.Provider value={{ c, f, setC, setF }}>
                        {ReactDOM.createPortal(<TempC />, document.getElementById('divRangeC'))}
                        {ReactDOM.createPortal(<TempF />, document.getElementById('divRangeF'))}
                    </TempContext.Provider>
                </>
            );
        }

        // 2. Componente Celsius
        function TempC() {
            const { c, setC, setF } = React.useContext(TempContext);
            return (
                <>
                    - Celsius (°C): <span>{c}</span><br />
                    <input type="range" min="-100.00" max="100.00" value={c} step="0.01"
                        onChange={e => { const valFixed = Number(e.target.value).toFixed(2); setC(valFixed); setF((e.target.value * 9 / 5 + 32).toFixed(2)); }} />
                </>
            );
        }

        // 3. Componente Fahrenheit
        function TempF() {
            const { f, setC, setF } = React.useContext(TempContext);
            return (
                <>
                    - Fahrenheit (°F): <span>{f}</span><br />
                    <input type="range" min="-148.00" max="212.00" value={f} step="0.01"
                        onChange={e => { const valFixed = Number(e.target.value).toFixed(2); setF(valFixed); setC(((e.target.value - 32) * 5 / 9).toFixed(2)); }} />
                </>
            );
        }

        // Avvio dell'app in un punto qualsiasi (l'albero reale si sposterà grazie ai Portali)
        ReactDOM.createRoot(document.createElement('div')).render(<App />);
    </script>
</body>

</html>
