<script>

      //FUNZIONI CON SCOPE GLOBALE
      function Variables() {
            console.log( "Click on Button Variables ... "); 
      }
      //
      function Distance() {
            console.log( "Click on Button Distance ... "); 
      }
      function RemoveDistance() {
            console.log( "Click on Button Remove Distance ... "); 
      }
      // 
      function Area() {
            console.log( "Click on Button Area ... "); 
      }
      function RemoveArea() {
            console.log( "Click on Button Remove Area ... "); 
      }

      var actionsFormatter = function(cell, formatterParams, onRendered){
            var rowNumber = cell.getRow().getPosition(true); 
            // Nota: passando 'true' a getPosition(true) conta solo le righe visibili/attive

            var result = ""; 
            result = `
                  <div style="border: 0; margin: 0vh; padding: 0vh; overflow-x: auto;" >
                        <button id=${"btnCell01_Row" + rowNumber } 
                              onclick=${ (
                                    () => {
                                          if( rowNumber == 1 ) { return " ' Variables(); '" }
                                          else if( rowNumber == 2 ) { return " ' Distance(); ' " }
                                          else if( rowNumber == 3 ) { return " ' Area(); ' " }
                                    }
                              )() } 
                              style="width: 55%; color: white; background-color: transparent; border: 1px solid white; border-radius: 4px; margin: 0vh; padding: 0.05vh; ">
                                    ${ (
                                          () => { 
                                                if( rowNumber == 1 ) { //TABULATOR JS INIZIA DA 1
                                                      return( glob_lang == "eng" ? "VARIABLES" : ( glob_lang == "ita" ? "VARIABILI" : "" ) );  
                                                } else if( rowNumber == 2 ) {
                                                      return( glob_lang == "eng" ? "DISTANCE" : ( glob_lang == "ita" ? "DISTANZA" : "" ) );    
                                                } else if( rowNumber == 3 ) {
                                                      return( glob_lang == "eng" ? "AREA" : ( glob_lang == "ita" ? "AREA" : "" ) );   
                                                }
                                          }
                                    )() } 
                        </button> `;
            if( rowNumber == 2 || rowNumber == 3 ) { //TABULATOR JS INIZIA DA 1 
                  result = result + `
                        <button id=${"btnCell02_Row" + rowNumber }  
                              onclick=${ (
                                    () => {
                                          if( rowNumber == 1 ) { /* */ }
                                          else if( rowNumber == 2 ) { return " ' RemoveDistance(); ' " }
                                          else if( rowNumber == 3 ) { return " ' RemoveArea(); ' " }
                                    }
                              )() }
                              style="width: 40%; color: white; background-color: transparent; border: 1px solid white; border-radius: 4px; margin: 0vh; padding: 0.05vh; ">
                                    ${ (
                                          () => { 
                                                if( rowNumber == 1 ) { //TABULATOR JS INIZIA DA 1
                                                      return( glob_lang == "eng" ? "" : ( glob_lang == "ita" ? "" : "" ) );  
                                                } else if( rowNumber == 2 ) {
                                                      return( glob_lang == "eng" ? "Remove" : ( glob_lang == "ita" ? "Rimuovi" : "" ) );    
                                                } else if( rowNumber == 3 ) {
                                                      return( glob_lang == "eng" ? "Remove" : ( glob_lang == "ita" ? "Rimuovi" : "" ) );   
                                                }
                                          }
                                    )() } 
                        </button> 
                        </div>
                  `;
            } else {
                  result = result + `</div>`; 
            }

            return result;  
      };

      mapButtons = new Tabulator("#mapButtons", { 
            data: glob_mapButtons, //[{}], // Messo un oggetto vuoto per mostrare almeno una riga di test
            layout: "fitColumns", 
            //height: "100%", //Evitare per MANCANZA di SCROLLBAR verticale

            //autoColumns: true, // Crea automaticamente le colonne in base alle chiavi 
            columns: [
                  {
                        title: "Map Control Buttons", 
                        headerTooltip: true, 
                        field: "mapButtons",
                        widthGrow: 1, 
                        formatter: actionsFormatter,
                        resizable: false, 
                        headerSort: false, 
                        // Gestione del click 
                        cellClick: function(e, cell){ 
                              //var rowData = cell.getRow().getData();
                              var target = e.target; // L'elemento cliccato
                              console.log( "Cell Click ... " );

                        }
                },
            ],


            footerElement:
                  "<div style='height: 2vh'>" +
                  "<br>" +
                  "</div>"
      });

      //CSS via JS
      document.getElementById("mapButtons").style.fontFamily = glob_font;
      
	mapButtons.element.style.fontSize = "1.3vh"; 


</script>
