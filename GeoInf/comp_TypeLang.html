      <div> 

            <div id="typeLang"
			style="width: 7%; max-width: 7%; height: 15vh; max-height: 15vh; float: left; 
                        margin-top: 0; margin-bottom: 0; margin-left: 0; margin-right: 1px; 
                        padding: 0; ">

</div>

<script>

      //FUNZIONI CON SCOPE GLOBALE!
      function ChangeTypeLang( numbOption ) {
            switch( numbOption ) {
                  case 1: glob_lang = "eng"; break; 
                  case 2: glob_lang = "ita"; break; 
                  default: glob_lang = "eng"; break; 
            }

            //btnTab (Intestazioni Tab)

            if( glob_lang == "eng" ) {
                  document.getElementById("btnTab01").innerText = "INITIAL DATA";
                  document.getElementById("titleTab01").innerText = "INITIAL DATA";
                  document.getElementById("btnTab02").innerText = "CHARGE COLUMNS LOCALIZATION";
                  document.getElementById("titleTab02").innerText = "CHARGE COLUMNS LOCALIZATION";
                  document.getElementById("btnTab03").innerText = "ROUTE SEARCH";
                  document.getElementById("titleTab03").innerText = "ROUTE SEARCH";

            } else if( glob_lang == "ita" ) {
                  document.getElementById("btnTab01").innerText = "DATI INIZIALI";
                  document.getElementById("titleTab01").innerText = "DATI INIZIALI";
                  document.getElementById("btnTab02").innerText = "LOCALIZZAZIONE COLONNINE DI RICARICA";
                  document.getElementById("titleTab02").innerText = "LOCALIZZAZIONE COLONNINE DI RICARICA";
                  document.getElementById("btnTab03").innerText = "RICERCA PERCORSI";
                  document.getElementById("titleTab03").innerText = "RICERCA PERCORSI";
            }

            //ReDraw Tabelle Tabulator JS INCOMPLETO

            //Traduzione COMPONENTI

            latLngZoom.destroy(); 
            latLngZoom = funcLatLngZoom(); 

            baseMap.destroy(); 
            baseMap = funcBaseMap(); 

            mapButtons.destroy(); 
            mapButtons = funcMapButtons(); 

            typeDistance.destroy(); 
            typeDistance = funcTypeDistance();  

            typeLang.destroy(); 
            typeLang = funcTypeLang();  

            /* *** */

            //RIGHT SIDE

            initialDataRow00.destroy(); 
            initialDataRow00 = funcInitialDataRow00();  
             
      } 

      var actionsFormatterTypeLang = function(cell, formatterParams, onRendered){
            var rowNumber = cell.getRow().getPosition(true); 
            // Nota: passando 'true' a getPosition(true) conta solo le righe visibili/attive

            var typeLangRadioName = ""; 
            (
                  () => { 
                        if( rowNumber == 1 ) { //TABULATOR JS INIZIA DA 1 
                              ( glob_lang == "eng" ? typeLangRadioName = "English" : ( glob_lang == "ita" ? typeLangRadioName = "Inglese" : "" ) );  
                        } else if( rowNumber == 2 ) {
                              ( glob_lang == "eng" ? typeLangRadioName = "Italian" : ( glob_lang == "ita" ? typeLangRadioName = "Italiano" : "" ) );    
                        }
                  }
            )()

            var result = ""; 
            result = `
                  <div style="border: 0; margin: 0vh; padding: 0vh; overflow-x: auto;" >
                        <input type="radio" id=${"typeLangRadio" + rowNumber } name="typeLangGroup" value=${typeLangRadioName} style="transform: scale(1.2)"; 
                        onchange=${ (
                                    () => {
                                          return ( " 'ChangeTypeLang( " + rowNumber + "); ' " ); //ATTENZIONE VIRGOLETTE '... ' NECESSARIE
                                    }
                              )() }
                        ${ (
                              () => {
                                    if( rowNumber == 1 && glob_lang == "eng" ) return "checked"; 
                                    else if( rowNumber == 2 && glob_lang == "ita" ) return "checked"; 
                                    else ""; 
                              }
                        )() }
                        >
                              ${typeLangRadioName} 
                        </input>
                  </div>`;
            return result;  
      };

      funcTypeLang = () => {
            return new Tabulator("#typeLang", { 
                  data: glob_typeLang, //[{}], // Messo un oggetto vuoto per mostrare almeno una riga di test
                  layout: "fitColumns", 
                  //height: "100%", //Evitare per MANCANZA di SCROLLBAR verticale

                  //autoColumns: true, // Crea automaticamente le colonne in base alle chiavi 
                  columns: [
                        {
                              title: ( glob_lang == "eng" ? "Language" : ( glob_lang == "ita" ? "Lingua" : "" ) ), 
                              headerTooltip: true,
                              headerHozAlign: "center", 
                              field: "typeLang",
                              widthGrow: 1, 
                              formatter: actionsFormatterTypeLang,
                              resizable: false, 
                              headerSort: false, 
                              // Gestione del click 
                              cellClick: function(e, cell){ 
                                    //var rowData = cell.getRow().getData();
                                    var target = e.target; // L'elemento cliccato
                                    console.log( "Click Cell ... " );

                              }
                  },
                  ],


                  footerElement:
                        "<div style='height: 2vh'>" +
                        "<br>" +
                        "</div>"
            });
      }

      typeLang = funcTypeLang(); 

      //CSS via JS
      document.getElementById("typeLang").style.fontFamily = glob_font;
      
	typeLang.element.style.fontSize = "1.3vh"; 


</script>
