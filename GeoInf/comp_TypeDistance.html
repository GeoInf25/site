      <div>

            <div id="typeDistance"
			style="width: 8%; max-width: 8%; height: 15vh; max-height: 15vh; float: left; 
                        margin-top: 0; margin-bottom: 0; margin-left: 0; margin-right: 1px; 
                        padding: 0; ">
		</div> <!-- 1.75vh style='float: left; ' width: 100%; -->
      </div>

</div>

<script>

      //FUNZIONI CON SCOPE GLOBALE!
      function ChangeTypeDistance( numbOption ) {
            glob_numbTypeDistance = numbOption; 
             
      } 

      var actionsFormatterTypeDistance = function(cell, formatterParams, onRendered){
            var rowNumber = cell.getRow().getPosition(true); 
            // Nota: passando 'true' a getPosition(true) conta solo le righe visibili/attive

            var typeDistanceRadioName = ""; 
            (
                  () => { 
                        if( rowNumber == 1 ) { //TABULATOR JS INIZIA DA 1 
                              ( glob_lang == "eng" ? typeDistanceRadioName = "Euclidean" : ( glob_lang == "ita" ? typeDistanceRadioName = "Euclideo" : "" ) );  
                        } else if( rowNumber == 2 ) {
                              ( glob_lang == "eng" ? typeDistanceRadioName = "Manhattan" : ( glob_lang == "ita" ? typeDistanceRadioName = "Manhattan" : "" ) );    
                        }
                  }
            )()

            var result = ""; 
            result = `
                  <div style="border: 0; margin: 0vh; padding: 0vh; overflow-x: auto;" >
                        <input type="radio" id=${"typeDistanceRadio" + rowNumber } name="typeDistanceGroup" value=${typeDistanceRadioName} style="transform: scale(1.2)"; 
                        onchange=${ (
                                    () => {
                                          return ( " 'ChangeTypeDistance( " + rowNumber + "); ' " ); //ATTENZIONE VIRGOLETTE '... ' NECESSARIE
                                    }
                              )() }
                        ${ ( rowNumber == glob_numbTypeDistance ? "checked" : "" )}
                        >
                              ${typeDistanceRadioName}
                        </input>
                  </div>`;
            return result;  
      };

      funcTypeDistance = () => {
            return new Tabulator("#typeDistance", { 
                  data: glob_typeDistance, //[{}], // Messo un oggetto vuoto per mostrare almeno una riga di test
                  layout: "fitColumns", 
                  //height: "100%", //Evitare per MANCANZA di SCROLLBAR verticale

                  //autoColumns: true, // Crea automaticamente le colonne in base alle chiavi 
                  columns: [
                        {
                              title: ( glob_lang == "eng" ? "Distance Type" : ( glob_lang == "ita" ? "Tipo Distanza" : "" ) ), 
                              headerTooltip: true, 
                              headerHozAlign: "center",
                              field: "typeDistance",
                              widthGrow: 1, 
                              formatter: actionsFormatterTypeDistance,
                              resizable: false, 
                              headerSort: false, 
                              // Gestione del click 
                              cellClick: function(e, cell){ 
                                    //var rowData = cell.getRow().getData();
                                    var target = e.target; // L'elemento cliccato
                                    console.log( "Click Cell ... " );

                              }
                  },
                  ],


                  footerElement:
                        "<div style='height: 2vh'>" +
                        "<br>" +
                        "</div>"
            });
      }

      typeDistance = funcTypeDistance(); 

      //CSS via JS
      document.getElementById("typeDistance").style.fontFamily = glob_font;
      
	typeDistance.element.style.fontSize = "1.3vh"; 


</script>
