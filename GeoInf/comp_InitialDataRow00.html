<script>

      //FUNZIONI CON SCOPE GLOBALE
      function Foo01() {
            console.log( "Click on Button Foo01 ... "); 
      }
      //
      function Foo02() {
            console.log( "Click on Button Foo02 ... "); 
      }

      var actionsFormatterInitialDataRow00 = function(cell, formatterParams, onRendered){
            var rowNumber = cell.getRow().getPosition(true); 
            // Nota: passando 'true' a getPosition(true) conta solo le righe visibili/attive

            var result = ""; 
            if( rowNumber == 1 ) {
                  result = `
                        <div style="border: 0; margin: 0vh; padding: 0vh; overflow-x: auto;" >
                              <textarea 
                                    id=${"txt00_InitialDataRow00"}
                                    style="width: 100%; height: 5.5vh; color: white; background-color: transparent; border: 0; margin: 0vh; padding: 0.25vh; font-family: ${ glob_font }; resize: none; " 
                                    readonly
                                    >${ ( ()=> {
                                          if( glob_lang == "eng" ) {
                                                return "Search on map, through Overpass Turbo query, of potential Customers and possible locations of charging stations, the latter called Plant or POI (Points Of Interest, i.e. markets, existing charging stations, car parks): "; 
                                          } else if( glob_lang == "ita" ) {
                                                return "Ricerca su mappa, tramite query Overpass Turbo, di potenziali clienti e possibili localizzazioni per stazioni di ricarica, queste ultime definite come Impianti o POI (Punti di Interesse, come supermercati, stazioni di ricarica esistenti parcheggi): "; 
                                          }
                                    })() }</textarea>
                        </div> 
                        `
            } else if( rowNumber == 2 ) {
                  result = `
                        <div style="border: 0; margin: 0vh; padding: 0vh; overflow-x: auto;" >
                              <button id=${"btn00_InitialDataRow00" }  
                                    onclick=${ (
                                          () => {
                                                return " ' Foo01(); ' "; 
                                          }
                                    )() } 
                                    style="width: 30%; height: 2.5vh; color: white; background-color: transparent; border: 1px solid white; border-radius: 4px; margin: 0vh; padding: 0.05vh; font-family: ${ glob_font }; "
                                    >
                                    ${ (
                                          () => { 
                                                if( glob_lang == "eng" ) {
                                                      return "Make Search on Map"; 
                                                } else if( glob_lang == "ita" ) { 
                                                      return "Esegui Ricerche in Mappa"; 
                                                } else {
                                                      return ""; 
                                                } 
                                          }
                                    )() } 
                              </button>
                              <button id=${"btn01_InitialDataRow00" } 
                                    onclick=${ (
                                          () => {
                                                return " ' Foo02(); ' "; 
                                          }
                                    )() } 
                                    style="width: 50%; height: 2.5vh; color: white; background-color: transparent; border: 1px solid white; border-radius: 4px; margin: 0vh; padding: 0.05vh; font-family: ${ glob_font }; ">
                                    ${ (
                                          () => { 
                                                if( glob_lang == "eng" ) {
                                                      return "Removing of Customer and Plant / POI Markers"; 
                                                } else if( glob_lang == "ita" ) { 
                                                      return "Rimozione dei marcatori cliente ed impianto / POI"; 
                                                } else {
                                                      return ""; 
                                                } 
                                          }
                                    )() } 
                              </button>
                        </div>
                        `
            }
            return result;  
      };

      funcInitialDataRow00 = () => { 
            return new Tabulator("#initialDataRow00", { 
                  data: glob_initialDataRow00, //[{}], // Messo un oggetto vuoto per mostrare almeno una riga di test
                  layout: "fitColumns", 
                  //height: "100%", //Evitare per MANCANZA di SCROLLBAR verticale

                  //autoColumns: true, // Crea automaticamente le colonne in base alle chiavi 
                  columns: [
                        {
                              //title: ( glob_lang == "eng" ? "" : ( glob_lang == "ita" ? "" : "" ) ), 
                              //headerTooltip: true, 
                              //headerHozAlign: "center", 
                              field: "initialDataRow00",
                              widthGrow: 1, 
                              formatter: actionsFormatterInitialDataRow00,
                              resizable: false, 
                              headerSort: false,  
                              // Gestione del click 
                              cellClick: function(e, cell){ 
                                    //var rowData = cell.getRow().getData();
                                    var target = e.target; // L'elemento cliccato
                                    console.log( "Cell Click ... " );  

                              }
                  },
                  ],

                  footerElement:
                        "<div style='height: 0.1vh'>" +
                        "<br>" +
                        "</div>"
            });
      }

      initialDataRow00 = funcInitialDataRow00(); 

      //CSS via JS
      document.getElementById("initialDataRow00").style.fontFamily = glob_font;
      
	initialDataRow00.element.style.fontSize = "1.3vh"; 


</script>
